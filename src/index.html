<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <title>Overlay</title>
</head>
<body>

  <div id="toolbar">
    <!-- Drag Handle -->
    <div id="drag-handle">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="6" cy="4" r="1" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="4" r="1" fill="currentColor" stroke="none"/>
        <circle cx="6" cy="8" r="1" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="8" r="1" fill="currentColor" stroke="none"/>
        <circle cx="6" cy="12" r="1" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="12" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <!-- Click-Through Toggle -->
    <button id="btn-click-through" class="toolbar-btn" title="Toggle Click-Through">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 2l10 5.5-4.5 1.2-1.2 4.5L3 2z"/>
        <path d="M8.5 8.7l3 3"/>
      </svg>
    </button>

    <!-- Opacity Control -->
    <div id="opacity-control">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <ellipse cx="8" cy="8" rx="6" ry="4"/>
        <circle cx="8" cy="8" r="2"/>
      </svg>
      <input type="range" id="opacity-slider" min="10" max="100" value="85" step="5">
      <span id="opacity-value">85%</span>
    </div>

    <!-- Settings -->
    <button id="btn-settings" class="toolbar-btn" title="Settings">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="8" cy="8" r="2.5"/>
        <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>
      </svg>
    </button>

    <!-- Minimize -->
    <button id="btn-minimize" class="toolbar-btn" title="Minimize">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 8h10"/>
      </svg>
    </button>

    <!-- Close -->
    <button id="btn-close" class="toolbar-btn" title="Close">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 4l8 8M12 4l-8 8"/>
      </svg>
    </button>
  </div>

  <div id="webview-container">
    <webview id="site-view" src="about:blank" allowpopups></webview>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
