<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <title>Fixed Tool - Grid & Workspaces</title>
</head>
<body>

  <!-- Top Bar: Workspaces (Super Abas) + Janela / Overlay Controls -->
  <header id="top-bar">
    <!-- Drag Handle da Janela -->
    <div id="drag-handle" title="Arraste para mover a janela">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="5" cy="4" r="1" fill="currentColor" stroke="none"/>
        <circle cx="11" cy="4" r="1" fill="currentColor" stroke="none"/>
        <circle cx="5" cy="8" r="1" fill="currentColor" stroke="none"/>
        <circle cx="11" cy="8" r="1" fill="currentColor" stroke="none"/>
        <circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/>
        <circle cx="11" cy="12" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <!-- Super Abas: Workspaces (Áreas de Trabalho) -->
    <div id="workspace-tabs-wrapper">
      <nav id="workspace-tabs" aria-label="Áreas de Trabalho">
        <!-- Renderizado dinamicamente pelo renderer.js -->
      </nav>
      <button id="btn-add-workspace" class="topbar-btn" title="Nova Área de Trabalho (+)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3v10M3 8h10"/>
        </svg>
      </button>
    </div>

    <!-- Controles Globais da Janela & Sistema -->
    <div id="top-controls">
      <!-- Otimizador de RAM -->
      <button id="btn-ram-optimize" class="topbar-btn" title="Limpar Cache e Otimizar RAM">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3M3.4 3.4l2.1 2.1M10.5 10.5l2.1 2.1M3.4 12.6l2.1-2.1M10.5 5.5l2.1-2.1"/>
          <circle cx="8" cy="8" r="2.2" fill="currentColor"/>
        </svg>
      </button>

      <!-- Click-Through Toggle -->
      <button id="btn-click-through" class="topbar-btn" title="Ativar/Desativar Click-Through">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 2l10 5.5-4.5 1.2-1.2 4.5L3 2z"/>
          <path d="M8.5 8.7l3 3"/>
        </svg>
      </button>

      <!-- Opacidade -->
      <div id="opacity-control" title="Ajustar Opacidade do Overlay">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <ellipse cx="8" cy="8" rx="6" ry="4"/>
          <circle cx="8" cy="8" r="2"/>
        </svg>
        <input type="range" id="opacity-slider" min="10" max="100" value="85" step="5">
        <span id="opacity-value">85%</span>
      </div>

      <!-- Configurações -->
      <button id="btn-settings" class="topbar-btn" title="Configurações">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="2.5"/>
          <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>
        </svg>
      </button>

      <!-- Minimizar -->
      <button id="btn-minimize" class="topbar-btn" title="Minimizar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 8h10"/>
        </svg>
      </button>

      <!-- Fechar -->
      <button id="btn-close" class="topbar-btn" title="Fechar Aplicação">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 4l8 8M12 4l-8 8"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Sub-Bar: Controles do Workspace Ativo (Layouts e Ações Rápidas) -->
  <section id="workspace-subbar">
    <div id="layout-selector-wrapper">
      <span class="subbar-label">Layout:</span>
      <div id="layout-selector">
        <button class="layout-btn" data-layout="1x1" title="1x1 (Foco Total / 1 Janela)">
          <span class="layout-icon icon-1x1"></span>
          <span>1x1</span>
        </button>
        <button class="layout-btn" data-layout="1x2" title="1x2 (Lado a Lado / 2 Colunas)">
          <span class="layout-icon icon-1x2"></span>
          <span>1x2</span>
        </button>
        <button class="layout-btn" data-layout="2x1" title="2x1 (Empilhado / 2 Linhas)">
          <span class="layout-icon icon-2x1"></span>
          <span>2x1</span>
        </button>
        <button class="layout-btn active" data-layout="2x2" title="2x2 (Grade 4 Quadrantes)">
          <span class="layout-icon icon-2x2"></span>
          <span>2x2</span>
        </button>
        <button class="layout-btn" data-layout="1x3" title="1x3 (3 Colunas Lado a Lado)">
          <span class="layout-icon icon-1x3"></span>
          <span>1x3</span>
        </button>
        <button class="layout-btn" data-layout="3x1" title="3x1 (3 Linhas Empilhadas)">
          <span class="layout-icon icon-3x1"></span>
          <span>3x1</span>
        </button>
        <button class="layout-btn" data-layout="3x3" title="3x3 (Grade 9 Quadrantes)">
          <span class="layout-icon icon-3x3"></span>
          <span>3x3</span>
        </button>
        <button class="layout-btn" data-layout="auto" title="Auto (Distribuição Automática Dinâmica)">
          <span class="layout-icon icon-auto"></span>
          <span>Auto</span>
        </button>
      </div>
    </div>

    <div id="subbar-actions">
      <!-- Botão Adicionar Janela -->
      <button id="btn-add-panel" class="action-btn primary" title="Adicionar Nova Janela no Workspace">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3v10M3 8h10"/>
        </svg>
        <span>+ Nova Janela</span>
      </button>

      <!-- Botão Auto-Resize / Redistribuir -->
      <button id="btn-auto-resize" class="action-btn secondary" title="Redistribuir Grade (Auto-Resize para Proporções Iguais)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2" y="2" width="5" height="5" rx="1"/>
          <rect x="9" y="2" width="5" height="5" rx="1"/>
          <rect x="2" y="9" width="5" height="5" rx="1"/>
          <rect x="9" y="9" width="5" height="5" rx="1"/>
        </svg>
        <span>Auto-Resize</span>
      </button>

      <!-- Botão Suspender Abas Inativas -->
      <button id="btn-sleep-all" class="action-btn secondary" title="Suspender Janelas Inativas para Liberar RAM">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 4h6l-5 6h5M10 9h3l-2.5 3h2.5"/>
        </svg>
        <span>Suspender Inativas</span>
      </button>

      <span id="workspace-status" class="subbar-stats">4 abas</span>
    </div>
  </section>

  <!-- Container Principal do Grid -->
  <main id="grid-container" class="layout-2x2">
    <!-- Os painéis de abas (.grid-panel) serão criados e gerenciados dinamicamente pelo renderer.js -->
  </main>

  <!-- Notificação Toast Flutuante -->
  <div id="toast" class="toast hidden"></div>

  <script src="renderer.js"></script>
</body>
</html>
